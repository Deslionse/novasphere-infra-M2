name: Terraform PR
on:
  pull_request:
    paths: ["envs/**", "modules/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tfstate-dev

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    env:
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_environment: dev
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Cle publique SSH (lue par aws_key_pair)
        env:
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: mkdir -p ~/.ssh && printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/novasphere.pub

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"

      - run: terraform fmt -check -recursive
        working-directory: .

      - run: terraform init -input=false

      - run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Commentaire sur la PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let plan = "Erreur lors de la lecture du fichier de plan.";
            try {
              plan = fs.readFileSync('envs/dev/plan.txt', 'utf8');
            } catch (err) {
              console.error(err);
            }
            const output = `#### Terraform Plan (dev) \`${{ steps.plan.outcome }}\`
            \`\`\`terraform
            ${plan}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Statut du plan
        if: steps.plan.outcome == 'failure'
        run: exit 1
